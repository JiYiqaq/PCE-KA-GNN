data_path: "data/raw/Active_Database.csv"
output_dir: "outputs/pce_material_only"
graph_cache_path: "data/processed/pce_topology_graphs.pt"
prepared_devices_cache_path: "data/processed/device_records.csv"

donor_column: "donor_smiles"
acceptor_column: "acceptor_smiles"
target_column: "pce"
encoder_atom: "cgcnn"
encoder_bond: "dim_14"

train_ratio: 0.8
validation_ratio: 0.1
test_ratio: 0.1
seed: 42
min_category_frequency: 2
preprocessing_workers: 8
graph_checkpoint_interval: 2000

in_feat: 113
hidden_feat: 64
fusion_hidden: 32
context_hidden: 32
grid_feat: 1
num_layers: 4
pooling: "avg"
use_bias: true
use_context: false

device: "cuda"
preload_graphs_to_gpu: true
graph_preload_max_free_fraction: 0.6
graph_preload_safety_factor: 2.0
batch_size: 256
num_workers: 0
epochs: 100
patience: 20
learning_rate: 0.0004
weight_decay: 0.0
lr_scheduler_factor: 0.5
lr_scheduler_patience: 8
min_learning_rate: 0.000001
